- id: ohubdev
  order: 1
  company: ohubdev
  role: Software engineer
  period: "2026"
  headline: Cut the audit screens from five requests to one
  summary: >-
    The audit views needed deeply nested data and made five REST calls to get it. I added a GraphQL
    layer to the ASP.NET Core backend with Hot Chocolate, so each view now loads in a single request.
    I also set up Azure AD sign-in with access control, and rewrote the time-record rules so audit
    data matches to the millisecond.
  stack: [C#, ASP.NET Core, GraphQL, Azure AD, CI/CD]

